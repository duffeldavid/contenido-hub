<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Contenido Lab</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lab">
  <meta name="theme-color" content="#0F1013">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="lab.css?v=1789335318">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='22' y='6' width='56' height='88' rx='12' fill='%2315171B' stroke='%235FD8F0' stroke-width='6'/><circle cx='50' cy='50' r='9' fill='%23FF3B5C'/></svg>">
</head>
<body>

<div class="app" id="app">

  <!-- Riel lateral (Mac) -->
  <aside class="rail" id="rail">
    <div class="marca">
      <span class="marca-frame" aria-hidden="true"><i></i></span>
      <span class="marca-txt">Contenido<b>Lab</b></span>
    </div>
    <nav class="rail-nav" id="railNav" aria-label="Secciones">
      <button data-vista="inicio" class="active"><svg class="ic" viewBox="0 0 24 24"><path d="M4 11.5 12 5l8 6.5V19a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 19z"/><path d="M9.5 20.5v-6h5v6"/></svg><span>Inicio</span></button>
      <button data-vista="contenido"><svg class="ic" viewBox="0 0 24 24"><rect x="6" y="2.5" width="12" height="19" rx="3"/><path d="M10 9.5v5l4-2.5z"/></svg><span>Contenido</span></button>
      <button data-vista="stats"><svg class="ic" viewBox="0 0 24 24"><path d="M4 19h16"/><path d="M6.5 15.5V10M11 15.5V6M15.5 15.5v-3M20 15.5V8"/></svg><span>Estadísticas</span></button>
      <button data-vista="inspo"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3.5a6 6 0 0 0-3.4 10.9c.6.5.9 1.2.9 1.9v.2h5v-.2c0-.7.3-1.4.9-1.9A6 6 0 0 0 12 3.5z"/><path d="M9.8 19.5h4.4M10.5 21.5h3"/></svg><span>Inspiración</span></button>
      <button data-vista="mas"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/></svg><span>Más</span></button>
    </nav>
    <div class="rail-pie">
      <span class="sync" id="syncBadge"><i></i><span id="syncTxt">Solo en este navegador</span></span>
      <a class="rail-link" id="linkHub" href="../index.html">Contenido Hub</a>
    </div>
  </aside>

  <main class="principal" id="main">
    <section id="v-inicio" class="vista active"></section>
    <section id="v-contenido" class="vista"></section>
    <section id="v-stats" class="vista"></section>
    <section id="v-inspo" class="vista"></section>
    <section id="v-mas" class="vista"></section>
  </main>

  <!-- Barra inferior (iPhone) -->
  <nav class="tabbar" id="tabbar" aria-label="Secciones">
    <button data-vista="inicio" class="active"><svg class="ic" viewBox="0 0 24 24"><path d="M4 11.5 12 5l8 6.5V19a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 19z"/><path d="M9.5 20.5v-6h5v6"/></svg><span>Inicio</span></button>
    <button data-vista="contenido"><svg class="ic" viewBox="0 0 24 24"><rect x="6" y="2.5" width="12" height="19" rx="3"/><path d="M10 9.5v5l4-2.5z"/></svg><span>Contenido</span></button>
    <button data-vista="stats"><svg class="ic" viewBox="0 0 24 24"><path d="M4 19h16"/><path d="M6.5 15.5V10M11 15.5V6M15.5 15.5v-3M20 15.5V8"/></svg><span>Stats</span></button>
    <button data-vista="inspo"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3.5a6 6 0 0 0-3.4 10.9c.6.5.9 1.2.9 1.9v.2h5v-.2c0-.7.3-1.4.9-1.9A6 6 0 0 0 12 3.5z"/><path d="M9.8 19.5h4.4M10.5 21.5h3"/></svg><span>Inspiración</span></button>
    <button data-vista="mas"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/></svg><span>Más</span></button>
  </nav>
</div>

<!-- Ficha (lateral en Mac, hoja inferior en iPhone) -->
<div class="sheet-backdrop" id="sheetBackdrop"></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Ficha"></aside>

<div class="tip" id="tip" hidden></div>
<div class="toast" id="toast" hidden></div>

<script src="datos.js?v=1789335318"></script>
<script src="lab.js?v=1789335318"></script>
</body>
</html>
