<style>
/* ============ CONTENIDO HUB ============ */
:root {
  --bg: #0e0f0d;
  --bg-soft: #161814;
  --card: #1c1f1a;
  --card-hover: #23271f;
  --line: #2c3028;
  --text: #eceee8;
  --text-dim: #9aa093;
  --text-faint: #6b7064;
  --forestal: #7FB069;
  --forestal-deep: #4A7C59;
  --manzanares: #E2725B;
  --manzanares-deep: #B2452C;
  --amber: #d9a441;
  --radius: 14px;
  --font-head: "Sora", sans-serif;
  --font-body: "Inter", sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  min-height: 100vh;
}

/* ---------- Topbar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 50;
  background: rgba(14,15,13,.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}
.topbar-inner {
  max-width: 1200px; margin: 0 auto;
  display: flex; align-items: center; gap: 20px;
  padding: 14px 24px 10px;
  flex-wrap: wrap;
}
.logo { display: flex; align-items: center; gap: 10px; font-family: var(--font-head); font-size: 18px; }
.logo b { font-weight: 700; }
.logo-dot {
  width: 12px; height: 12px; border-radius: 50%;
  background: linear-gradient(135deg, var(--forestal), var(--manzanares));
}
.brand-switch {
  display: flex; gap: 4px; background: var(--bg-soft);
  padding: 4px; border-radius: 99px; border: 1px solid var(--line);
}
.brand-switch button {
  border: 0; background: transparent; color: var(--text-dim);
  font-family: var(--font-body); font-size: 13px; font-weight: 500;
  padding: 6px 16px; border-radius: 99px; cursor: pointer;
  transition: all .18s;
}
.brand-switch button.active { background: var(--text); color: var(--bg); font-weight: 600; }
.brand-switch button[data-brand="forestal"].active { background: var(--forestal); }
.brand-switch button[data-brand="manzanares"].active { background: var(--manzanares); }

.month-info { margin-left: auto; text-align: right; }
.month-name { display: block; font-family: var(--font-head); font-weight: 600; font-size: 15px; }
.month-cadence { display: block; font-size: 12px; color: var(--text-faint); }

.tabs {
  max-width: 1200px; margin: 0 auto;
  display: flex; gap: 2px; padding: 0 24px;
  overflow-x: auto;
}
.tabs button {
  border: 0; background: transparent; color: var(--text-dim);
  font-family: var(--font-head); font-size: 14px; font-weight: 600;
  padding: 10px 16px; cursor: pointer; white-space: nowrap;
  border-bottom: 2px solid transparent;
  transition: color .18s, border-color .18s;
}
.tabs button:hover { color: var(--text); }
.tabs button.active { color: var(--text); border-bottom-color: var(--amber); }

/* ---------- Progress strip ---------- */
.progress-strip {
  max-width: 1200px; margin: 18px auto 0;
  padding: 0 24px;
  display: flex; gap: 12px; flex-wrap: wrap;
}
.stat {
  background: var(--bg-soft); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 12px 18px;
  min-width: 140px; flex: 1;
}
.stat .num { font-family: var(--font-head); font-size: 22px; font-weight: 700; }
.stat .lbl { font-size: 12px; color: var(--text-dim); }
.stat .bar { height: 4px; background: var(--line); border-radius: 2px; margin-top: 8px; overflow: hidden; }
.stat .bar i { display: block; height: 100%; border-radius: 2px; background: var(--amber); transition: width .4s; }

/* ---------- Main / views ---------- */
main { max-width: 1200px; margin: 0 auto; padding: 20px 24px 60px; }
.view { display: none; }
.view.active { display: block; animation: fadeIn .25s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.view-note { color: var(--text-dim); font-size: 13px; margin: 4px 0 18px; max-width: 720px; }

/* ---------- Calendario ---------- */
.cal-week { margin-bottom: 26px; }
.cal-week-label {
  font-family: var(--font-head); font-size: 12px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .12em; color: var(--text-faint);
  margin-bottom: 10px;
}
.cal-days { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
@media (max-width: 860px) { .cal-days { grid-template-columns: 1fr; } }

.cal-day { display: flex; flex-direction: column; gap: 10px; }
.cal-day-head { display: flex; align-items: baseline; gap: 8px; }
.cal-day-name { font-family: var(--font-head); font-weight: 600; font-size: 14px; }
.cal-day-date { color: var(--text-faint); font-size: 13px; }
.cal-day-head.today .cal-day-name { color: var(--amber); }
.today-chip {
  font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
  background: var(--amber); color: var(--bg); border-radius: 99px; padding: 2px 8px;
}

/* ---------- Cards ---------- */
.piece {
  background: var(--card); border: 1px solid var(--line);
  border-left: 3px solid var(--brand-color, var(--line));
  border-radius: var(--radius); padding: 14px 16px;
  cursor: pointer; transition: background .15s, transform .15s;
}
.piece:hover { background: var(--card-hover); transform: translateY(-1px); }
.piece.done { opacity: .55; }
.piece-top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
.chip {
  font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 99px;
  background: var(--bg-soft); color: var(--text-dim); border: 1px solid var(--line);
}
.chip.brand { color: var(--brand-color); border-color: transparent; background: color-mix(in srgb, var(--brand-color) 14%, transparent); }
.chip.estado { color: var(--bg); border: 0; }
.chip.reencauche { color: var(--amber); border-color: color-mix(in srgb, var(--amber) 40%, transparent); }
.piece-title { font-family: var(--font-head); font-weight: 600; font-size: 14.5px; line-height: 1.35; }
.piece-meta { margin-top: 6px; font-size: 12px; color: var(--text-faint); }

/* Estados */
.st-Idea { background: #8a8f85; }
.st-PorGrabar { background: var(--amber); }
.st-EnEdicion { background: #d97b41; }
.st-Listo { background: #5b9bd5; }
.st-Programado { background: #9b7bd5; }
.st-Publicado { background: #58b368; }

/* ---------- Pipeline ---------- */
.pipeline { display: grid; grid-template-columns: repeat(6, minmax(190px, 1fr)); gap: 12px; overflow-x: auto; }
@media (max-width: 1100px) { .pipeline { display: flex; overflow-x: auto; padding-bottom: 12px; } .pipeline .pipe-col { min-width: 230px; } }
.pipe-col { background: var(--bg-soft); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; }
.pipe-col-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.pipe-col-head .dot { width: 8px; height: 8px; border-radius: 50%; }
.pipe-col-head .name { font-family: var(--font-head); font-size: 13px; font-weight: 600; }
.pipe-col-head .count { margin-left: auto; font-size: 12px; color: var(--text-faint); }
.pipe-col .piece { margin-bottom: 10px; padding: 11px 13px; }
.pipe-col .piece-title { font-size: 13px; }
.pipe-empty { color: var(--text-faint); font-size: 12px; text-align: center; padding: 14px 0; }

/* ---------- Rodaje ---------- */
.sesion { background: var(--bg-soft); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; margin-bottom: 20px; }
.sesion h3 { font-family: var(--font-head); font-size: 16px; margin-bottom: 4px; }
.sesion p.desc { color: var(--text-dim); font-size: 13px; margin-bottom: 14px; max-width: 720px; }
.sesion-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }

/* ---------- Referentes ---------- */
.ref-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.ref-card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 16px; display: block; text-decoration: none; color: var(--text);
  transition: background .15s, transform .15s;
}
.ref-card:hover { background: var(--card-hover); transform: translateY(-1px); }
.ref-card .handle { font-family: var(--font-head); font-weight: 600; font-size: 15px; }
.ref-card .why { font-size: 13px; color: var(--text-dim); margin-top: 6px; }
.ref-card .cat { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--amber); }
.ref-section-title { font-family: var(--font-head); font-size: 15px; font-weight: 600; margin: 26px 0 12px; }
.tactic { background: var(--bg-soft); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 18px; margin-bottom: 10px; }
.tactic b { font-family: var(--font-head); font-size: 13.5px; }
.tactic p { font-size: 13px; color: var(--text-dim); margin-top: 4px; }
.search-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.search-chips a {
  font-size: 12.5px; color: var(--text-dim); text-decoration: none;
  border: 1px solid var(--line); border-radius: 99px; padding: 6px 14px;
  transition: all .15s;
}
.search-chips a:hover { color: var(--text); border-color: var(--text-dim); }

/* ---------- Drawer ---------- */
.drawer-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,.5);
  opacity: 0; pointer-events: none; transition: opacity .22s; z-index: 90;
}
.drawer-backdrop.open { opacity: 1; pointer-events: auto; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(480px, 100vw);
  background: var(--bg-soft); border-left: 1px solid var(--line);
  transform: translateX(100%); transition: transform .25s ease; z-index: 100;
  overflow-y: auto; padding: 26px;
}
.drawer.open { transform: none; }
.drawer .close-btn {
  position: absolute; top: 16px; right: 16px;
  background: var(--card); border: 1px solid var(--line); color: var(--text-dim);
  width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 15px;
}
.drawer h2 { font-family: var(--font-head); font-size: 19px; line-height: 1.3; margin: 10px 0 4px; padding-right: 30px; }
.drawer .sub { color: var(--text-faint); font-size: 13px; margin-bottom: 16px; }
.drawer .tag-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
.drawer section { margin-bottom: 22px; }
.drawer section h4 {
  font-family: var(--font-head); font-size: 11px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .12em; color: var(--text-faint);
  margin-bottom: 8px;
}
.drawer .copy-text { font-size: 14px; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }

.estado-select { display: flex; flex-wrap: wrap; gap: 6px; }
.estado-select button {
  border: 1px solid var(--line); background: var(--card); color: var(--text-dim);
  font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 99px; cursor: pointer;
  transition: all .15s;
}
.estado-select button.sel { color: var(--bg); border-color: transparent; }

.check-item { display: flex; gap: 10px; align-items: flex-start; padding: 7px 0; cursor: pointer; }
.check-item input { margin-top: 3px; accent-color: var(--amber); cursor: pointer; }
.check-item span { font-size: 13.5px; color: var(--text); }
.check-item input:checked + span { color: var(--text-faint); text-decoration: line-through; }

.gear-list { list-style: none; }
.gear-list li { font-size: 13.5px; color: var(--text-dim); padding: 5px 0 5px 22px; position: relative; }
.gear-list li::before { content: "◆"; position: absolute; left: 4px; color: var(--amber); font-size: 9px; top: 9px; }

.ref-links a {
  display: block; font-size: 13.5px; color: var(--forestal);
  text-decoration: none; padding: 6px 0;
}
.ref-links a:hover { text-decoration: underline; }
.drawer .notion-link { display: inline-block; margin-top: 4px; font-size: 13px; color: var(--text-dim); }

/* ---------- Footer ---------- */
.footer {
  max-width: 1200px; margin: 0 auto; padding: 18px 24px 40px;
  display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  color: var(--text-faint); font-size: 12.5px;
  border-top: 1px solid var(--line);
}
.link-btn { background: none; border: 0; color: var(--text-dim); font-size: 12.5px; cursor: pointer; text-decoration: underline; }
.link-btn:hover { color: var(--text); }

</style>

// ============================================================
// CONTENIDO HUB — lógica de la app
// Sin dependencias. El avance (estados + checklists) vive en
// localStorage del navegador; los datos base en data.js.
// ============================================================

const ESTADOS = ["Idea", "Por grabar", "En edición", "Listo", "Programado", "Publicado"];
const ESTADO_CLASS = {
  "Idea": "st-Idea", "Por grabar": "st-PorGrabar", "En edición": "st-EnEdicion",
  "Listo": "st-Listo", "Programado": "st-Programado", "Publicado": "st-Publicado",
};
const DIAS = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];
const LS_KEY = "contenidoHub." + MES.clave;

// ---------- Estado persistente ----------
// El avance vive en localStorage y, en la versión Artifact (claude.ai),
// también embebido en la página (bloque #hub-state) para sincronizar
// entre dispositivos. Al cargar gana el más reciente (updatedAt).
let store = load();
function load() {
  let ls = null, emb = null;
  try { ls = JSON.parse(localStorage.getItem(LS_KEY)); } catch {}
  const el = document.getElementById("hub-state");
  if (el) { try { emb = JSON.parse(el.textContent); } catch {} }
  const candidatos = [ls, emb].filter(x => x && typeof x === "object");
  if (!candidatos.length) return { estados: {}, checks: {} };
  candidatos.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  const s = candidatos[0];
  return { estados: s.estados || {}, checks: s.checks || {}, updatedAt: s.updatedAt || 0 };
}
function save() {
  store.updatedAt = Date.now();
  try { localStorage.setItem(LS_KEY, JSON.stringify(store)); } catch {}
  if (window.hubSync) window.hubSync();
}
function estadoDe(p) { return store.estados[p.id] || p.estado; }
function checksDe(p) { return store.checks[p.id] || []; }

// ---------- Filtro de marca ----------
let marcaActiva = "todas";
function piezasVisibles() {
  return PIEZAS.filter(p => marcaActiva === "todas" || p.marca === marcaActiva)
    .slice().sort((a, b) => a.fecha.localeCompare(b.fecha));
}

// ---------- Helpers ----------
function fmtFecha(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  const date = new Date(y, m - 1, d);
  return { dia: DIAS[date.getDay()], num: d, date };
}
function hoyISO() {
  const n = new Date();
  return `${n.getFullYear()}-${String(n.getMonth() + 1).padStart(2, "0")}-${String(n.getDate()).padStart(2, "0")}`;
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function brandColor(p) { return MARCAS[p.marca].color; }

function pieceCard(p, { compact = false } = {}) {
  const est = estadoDe(p);
  const done = est === "Publicado";
  return `
    <article class="piece ${done ? "done" : ""}" style="--brand-color:${brandColor(p)}" data-id="${p.id}">
      <div class="piece-top">
        <span class="chip brand">${MARCAS[p.marca].nombre}</span>
        <span class="chip estado ${ESTADO_CLASS[est]}">${est}</span>
        ${p.reencauche ? `<span class="chip reencauche">Reencauche</span>` : ""}
      </div>
      <div class="piece-title">${esc(p.titulo)}</div>
      ${compact ? "" : `<div class="piece-meta">${p.formato} · ${esc(p.mensaje)} · ${esc(p.tono)}</div>`}
    </article>`;
}

// ---------- Vista: Calendario ----------
function renderCalendario() {
  const el = document.getElementById("view-calendario");
  const piezas = piezasVisibles();
  const hoy = hoyISO();

  // agrupar por fecha, luego por semana
  const porFecha = {};
  piezas.forEach(p => (porFecha[p.fecha] = porFecha[p.fecha] || []).push(p));
  const fechas = Object.keys(porFecha).sort();

  const semanas = {};
  fechas.forEach(f => {
    const { date } = fmtFecha(f);
    const monday = new Date(date);
    monday.setDate(date.getDate() - ((date.getDay() + 6) % 7));
    const wk = monday.toISOString().slice(0, 10);
    (semanas[wk] = semanas[wk] || []).push(f);
  });

  let html = `<p class="view-note">Cada fecha de publicación con sus piezas. Toca una pieza para ver el copy completo, el checklist de producción, el equipo y las referencias.</p>`;
  let wkNum = 1;
  for (const wk of Object.keys(semanas).sort()) {
    html += `<div class="cal-week"><div class="cal-week-label">Semana ${wkNum++}</div><div class="cal-days">`;
    for (const f of semanas[wk]) {
      const { dia, num } = fmtFecha(f);
      const esHoy = f === hoy;
      html += `
        <div class="cal-day">
          <div class="cal-day-head ${esHoy ? "today" : ""}">
            <span class="cal-day-name">${dia}</span>
            <span class="cal-day-date">${num} de septiembre</span>
            ${esHoy ? `<span class="today-chip">Hoy</span>` : ""}
          </div>
          ${porFecha[f].map(p => pieceCard(p)).join("")}
        </div>`;
    }
    html += `</div></div>`;
  }
  el.innerHTML = html;
}

// ---------- Vista: Pipeline ----------
function renderPipeline() {
  const el = document.getElementById("view-pipeline");
  const piezas = piezasVisibles();
  let html = `<p class="view-note">El flujo de producción. Toca una pieza y cambia su estado desde el panel — el avance se guarda solo en este navegador.</p><div class="pipeline">`;
  for (const est of ESTADOS) {
    const grupo = piezas.filter(p => estadoDe(p) === est);
    html += `
      <div class="pipe-col">
        <div class="pipe-col-head">
          <span class="dot ${ESTADO_CLASS[est]}"></span>
          <span class="name">${est}</span>
          <span class="count">${grupo.length}</span>
        </div>
        ${grupo.length ? grupo.map(p => pieceCard(p, { compact: true })).join("") : `<div class="pipe-empty">—</div>`}
      </div>`;
  }
  html += `</div>`;
  el.innerHTML = html;
}

// ---------- Vista: Rodaje ----------
function renderRodaje() {
  const el = document.getElementById("view-rodaje");
  const piezas = piezasVisibles();
  let html = `<p class="view-note">La clave anti-estancamiento: <b>dos días de rodaje al mes surten las 12 fechas de cada marca</b>. Todo lo demás es edición y diseño que puedes hacer cualquier noche. Graba con esta lista y el mes queda resuelto.</p>`;
  for (const key of ["s1", "s2", "ed"]) {
    const grupo = piezas.filter(p => p.sesion === key);
    if (!grupo.length) continue;
    html += `
      <div class="sesion">
        <h3>${SESIONES[key].nombre}</h3>
        <p class="desc">${SESIONES[key].desc}</p>
        <div class="sesion-grid">${grupo.map(p => pieceCard(p)).join("")}</div>
      </div>`;
  }
  el.innerHTML = html;
}

// ---------- Progreso ----------
function renderProgress() {
  const el = document.getElementById("progressStrip");
  const piezas = piezasVisibles();
  const pub = piezas.filter(p => estadoDe(p) === "Publicado").length;
  const listas = piezas.filter(p => ["Listo", "Programado", "Publicado"].includes(estadoDe(p))).length;
  const porGrabar = piezas.filter(p => estadoDe(p) === "Por grabar").length;
  const pct = piezas.length ? Math.round((pub / piezas.length) * 100) : 0;
  el.innerHTML = `
    <div class="stat">
      <div class="num">${pub}/${piezas.length}</div>
      <div class="lbl">publicadas este mes</div>
      <div class="bar"><i style="width:${pct}%"></i></div>
    </div>
    <div class="stat"><div class="num">${listas}</div><div class="lbl">listas o programadas</div></div>
    <div class="stat"><div class="num">${porGrabar}</div><div class="lbl">por grabar</div></div>
    <div class="stat"><div class="num">${piezas.filter(p => p.reencauche).length}</div><div class="lbl">reencauches (sin grabación)</div></div>`;
}

// ---------- Drawer ----------
const drawer = document.getElementById("drawer");
const backdrop = document.getElementById("drawerBackdrop");
let piezaAbierta = null;

function openDrawer(id) {
  const p = PIEZAS.find(x => x.id === id);
  if (!p) return;
  piezaAbierta = p;
  const m = MARCAS[p.marca];
  const { dia, num } = fmtFecha(p.fecha);
  const est = estadoDe(p);
  const checks = checksDe(p);

  drawer.innerHTML = `
    <button class="close-btn" id="drawerClose">✕</button>
    <span class="chip brand" style="--brand-color:${m.color}">${m.nombre} · ${m.handle}</span>
    <h2>${esc(p.titulo)}</h2>
    <div class="sub">${dia} ${num} de septiembre · ${p.formato}${p.reencauche ? " · Reencauche" : ""}</div>
    <div class="tag-row">
      <span class="chip">${esc(p.mensaje)}</span>
      <span class="chip">${esc(p.tono)}</span>
    </div>

    <section>
      <h4>Estado</h4>
      <div class="estado-select">
        ${ESTADOS.map(e => `<button data-estado="${e}" class="${e === est ? "sel " + ESTADO_CLASS[e] : ""}">${e}</button>`).join("")}
      </div>
    </section>

    <section>
      <h4>Idea / Copy</h4>
      <div class="copy-text">${esc(p.copy)}</div>
    </section>

    <section>
      <h4>Checklist de producción</h4>
      ${p.checklist.map((c, i) => `
        <label class="check-item">
          <input type="checkbox" data-check="${i}" ${checks.includes(i) ? "checked" : ""}>
          <span>${esc(c)}</span>
        </label>`).join("")}
    </section>

    <section>
      <h4>Equipo</h4>
      <ul class="gear-list">${p.gear.map(g => `<li>${esc(g)}</li>`).join("")}</ul>
    </section>

    <section>
      <h4>Referencias visuales</h4>
      <div class="ref-links">
        ${p.refs.map(r => `<a href="${r.url}" target="_blank" rel="noopener">↗ ${esc(r.label)}</a>`).join("")}
      </div>
      <a class="notion-link" href="${p.notion}" target="_blank" rel="noopener">Abrir en Notion →</a>
    </section>`;

  drawer.classList.add("open");
  backdrop.classList.add("open");

  drawer.querySelector("#drawerClose").onclick = closeDrawer;
  drawer.querySelectorAll("[data-estado]").forEach(b => {
    b.onclick = () => {
      store.estados[p.id] = b.dataset.estado;
      save();
      openDrawer(p.id); // re-render drawer
      renderAll();
    };
  });
  drawer.querySelectorAll("[data-check]").forEach(cb => {
    cb.onchange = () => {
      const i = Number(cb.dataset.check);
      const set = new Set(checksDe(p));
      cb.checked ? set.add(i) : set.delete(i);
      store.checks[p.id] = [...set];
      save();
    };
  });
}
function closeDrawer() {
  drawer.classList.remove("open");
  backdrop.classList.remove("open");
  piezaAbierta = null;
}
backdrop.addEventListener("click", closeDrawer);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });

// clic en cualquier tarjeta
document.getElementById("main").addEventListener("click", e => {
  const card = e.target.closest(".piece");
  if (card) openDrawer(card.dataset.id);
});

// ---------- Navegación ----------
document.getElementById("brandSwitch").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  marcaActiva = b.dataset.brand;
  document.querySelectorAll("#brandSwitch button").forEach(x => x.classList.toggle("active", x === b));
  renderAll();
});
document.getElementById("tabs").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("active", x === b));
  document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
  document.getElementById("view-" + b.dataset.view).classList.add("active");
});

// ---------- Export / reset ----------
document.getElementById("btnExport").onclick = async () => {
  const data = PIEZAS.map(p => ({
    marca: MARCAS[p.marca].nombre, fecha: p.fecha, pieza: p.titulo,
    estado: estadoDe(p), checklist: p.checklist.map((c, i) => ({ tarea: c, hecha: checksDe(p).includes(i) })),
  }));
  const payload = JSON.stringify({ mes: MES.titulo, exportado: new Date().toISOString(), piezas: data }, null, 2);
  const filename = `contenido-hub-${MES.clave}.json`;
  // En claude.ai las descargas pasan por la capacidad "downloads"
  if (window.claude && typeof window.claude.use === "function") {
    try {
      const dl = await window.claude.use("downloads");
      if (dl) { await dl.save({ filename, data: payload }); return; }
    } catch { return; } // el visor puede rechazar la descarga; no hay fallback posible ahí
  }
  const blob = new Blob([payload], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
};
document.getElementById("btnReset").onclick = () => {
  if (confirm("¿Reiniciar todos los estados y checklists al valor original del calendario?")) {
    store = { estados: {}, checks: {} };
    save();
    renderAll();
  }
};

// ---------- Init ----------
function renderAll() {
  renderProgress();
  renderCalendario();
  renderPipeline();
  renderRodaje();
  renderReferentes();
}
document.getElementById("monthName").textContent = MES.titulo;
document.getElementById("monthCadence").textContent = MES.cadencia;
renderAll();


// ---------- Sincronización Artifact (claude.ai) ----------
(function () {
  if (!window.claude || typeof window.claude.use !== "function") return;
  let ns = null, dirty = false, timer = null, readOnly = false;
  claude.use("artifact").then(a => { ns = a; if (dirty) schedule(); }).catch(() => {});
  window.hubSync = function () { dirty = true; schedule(); };
  function schedule() { clearTimeout(timer); timer = setTimeout(publicar, 2500); }
  async function publicar() {
    if (!ns || readOnly || !dirty) return;
    dirty = false;
    const json = JSON.stringify(store).replace(/</g, "\\u003c");
    const bloque = '<script id="hub-state" type="application/json">' + json + '<\/script>';
    const html = window.__PRISTINE.replace(/<script id="hub-state"[\s\S]*?<\/script\s*>/, bloque);
    try { await ns.publish(html); }
    catch (e) {
      const code = e && e.code;
      if (code === "not_granted" || code === "not_writer") {
        readOnly = true; // vista de solo lectura: el avance queda solo en este navegador
      }
      // "conflict": otra vista publicó primero; la página se recarga sola a esa versión.
    }
  }
})();
